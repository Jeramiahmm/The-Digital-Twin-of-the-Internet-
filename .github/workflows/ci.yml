name: CI

on:
  push:
    branches: [main, "claude/*"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check backend/ simulation/

      - name: Type check with mypy
        run: |
          pip install mypy
          mypy backend/models/schemas.py --ignore-missing-imports

      - name: Start server and test endpoints
        run: |
          python -m backend.main &
          sleep 3
          curl -f http://localhost:8000/api/health
          curl -f http://localhost:8000/api/nodes
          curl -f http://localhost:8000/api/incidents
          curl -f http://localhost:8000/api/predictions
          kill %1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t dt-backend .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t dt-frontend .
